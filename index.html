<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Recorder</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
  background: #0b0b0f;
  color: white;
}
body {
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 700px;
  min-height: 100vh;
  padding: 18px;
}
header {
  text-align: center;
  padding: 18px 0;
}
header h1 {
  margin: 0;
  font-size: 28px;
}
header p {
  margin: 7px 0 0;
  color: #999;
  font-size: 14px;
}
.card {
  background: #15151c;
  border: 1px solid #292932;
  border-radius: 22px;
  padding: 14px;
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
}
.video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #050505;
  border-radius: 17px;
  overflow: hidden;
}
video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
#previewVideo {
  display: block;
}
.recording-indicator {
  position: absolute;
  top: 13px;
  left: 13px;
  display: none;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,.7);
  padding: 7px 11px;
  border-radius: 30px;
  font-size: 13px;
  backdrop-filter: blur(10px);
}
.recording-indicator.active {
  display: flex;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ff3030;
  animation: blink 1s infinite;
}
@keyframes blink {
  50% {
    opacity: .25;
  }
}
.timer {
  position: absolute;
  top: 13px;
  right: 13px;
  display: none;
  background: rgba(0,0,0,.7);
  padding: 7px 11px;
  border-radius: 30px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(10px);
}
.timer.active {
  display: block;
}
.status {
  text-align: center;
  margin: 15px 0 5px;
  color: #aaa;
  font-size: 14px;
  min-height: 20px;
}
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}
button {
  border: 0;
  border-radius: 15px;
  padding: 15px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  color: white;
  background: #282832;
  transition: transform .12s, opacity .12s;
}
button:active {
  transform: scale(.96);
}
button:disabled {
  opacity: .4;
  cursor: not-allowed;
}
.record-btn {
  background: #e52d3b;
}
.stop-btn {
  background: #33333d;
}
.full-btn {
  grid-column: 1 / -1;
}
.download-btn {
  background: #245ee8;
}
.delete-btn {
  background: #3a2528;
}
.permission {
  margin-top: 15px;
  padding: 13px;
  background: #202028;
  border-radius: 14px;
  color: #aaa;
  font-size: 13px;
  line-height: 1.45;
}
.recordings {
  margin-top: 20px;
}
.recordings h2 {
  font-size: 19px;
  margin: 0 0 10px;
}
.recording-item {
  background: #15151c;
  border: 1px solid #292932;
  border-radius: 18px;
  padding: 12px;
  margin-bottom: 12px;
}
.recording-item video {
  width: 100%;
  max-height: 350px;
  border-radius: 12px;
  background: #000;
}
.recording-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}
.recording-name {
  font-size: 14px;
  color: #ddd;
}
.recording-size {
  font-size: 12px;
  color: #777;
}
.empty {
  text-align: center;
  color: #777;
  padding: 25px 10px;
  background: #15151c;
  border-radius: 18px;
  border: 1px solid #292932;
}
@media (max-width: 450px) {
  .app {
    padding: 12px;
  }
  header h1 {
    font-size: 24px;
  }
  button {
    padding: 14px 10px;
    font-size: 15px;
  }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎥 Video Recorder</h1>
    <p>Record, replay, and save your videos</p>
  </header>
  <div class="card">
    <div class="video-container">
      <video
        id="previewVideo"
        autoplay
        muted
        playsinline>
      </video>
      <div class="recording-indicator" id="recordingIndicator">
        <span class="dot"></span>
        RECORDING
      </div>
      <div class="timer" id="timer">
        00:00
      </div>
    </div>
    <div class="status" id="status">
      Camera not started
    </div>
    <div class="controls">
      <button
        class="record-btn"
        id="recordBtn">
        🔴 Record
      </button>
      <button
        class="stop-btn"
        id="stopBtn"
        disabled>
        ⏹ Stop
      </button>
      <button
        class="full-btn"
        id="cameraBtn">
        📷 Start Camera
      </button>
    </div>
    <div class="permission">
      <b>Camera & microphone:</b><br>
      When you press "Start Camera", your browser will ask for permission.
      Allow both camera and microphone access.
    </div>
  </div>
  <div class="recordings">
    <h2>📁 Your Recordings</h2>
    <div id="recordingsList">
      <div class="empty" id="emptyMessage">
        No recordings yet.<br>
        Press Record to make one.
      </div>
    </div>
  </div>
</div>
<script>
let stream = null;
let mediaRecorder = null;
let chunks = [];
let recordings = [];
let timerInterval = null;
let recordingStartTime = null;
const previewVideo =
  document.getElementById("previewVideo");
const recordBtn =
  document.getElementById("recordBtn");
const stopBtn =
  document.getElementById("stopBtn");
const cameraBtn =
  document.getElementById("cameraBtn");
const statusText =
  document.getElementById("status");
const recordingIndicator =
  document.getElementById("recordingIndicator");
const timer =
  document.getElementById("timer");
const recordingsList =
  document.getElementById("recordingsList");
const emptyMessage =
  document.getElementById("emptyMessage");
/* --------------------------------
   CAMERA
-------------------------------- */
async function startCamera() {
  try {
    statusText.textContent =
      "Requesting camera and microphone...";
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      },
      audio: true
    });
    previewVideo.srcObject = stream;
    await previewVideo.play();
    cameraBtn.textContent =
      "🔄 Camera Ready";
    statusText.textContent =
      "Camera ready — press Record";
  } catch (error) {
    console.error(error);
    statusText.textContent =
      "Camera permission was denied or unavailable.";
    alert(
      "Camera access is required.\n\n" +
      "Make sure Safari has permission to use your camera and microphone."
    );
  }
}
/* --------------------------------
   RECORDING
-------------------------------- */
function getSupportedMimeType() {
  const types = [
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];
  for (const type of types) {
    if (MediaRecorder.isTypeSupported(type)) {
      return type;
    }
  }
  return "";
}
function startRecording() {
  if (!stream) {
    alert(
      "Start the camera first."
    );
    return;
  }
  chunks = [];
  const mimeType =
    getSupportedMimeType();
  try {
    if (mimeType) {
      mediaRecorder =
        new MediaRecorder(
          stream,
          {
            mimeType: mimeType
          }
        );
    } else {
      mediaRecorder =
        new MediaRecorder(stream);
    }
  } catch (error) {
    alert(
      "This browser cannot record video."
    );
    return;
  }
  mediaRecorder.ondataavailable =
    function(event) {
      if (event.data &&
          event.data.size > 0) {
        chunks.push(event.data);
      }
    };
  mediaRecorder.onstop =
    function() {
      const finalType =
        mediaRecorder.mimeType ||
        "video/webm";
      const blob =
        new Blob(
          chunks,
          {
            type: finalType
          }
        );
      createRecording(blob);
    };
  mediaRecorder.start(250);
  recordingStartTime =
    Date.now();
  timerInterval =
    setInterval(updateTimer, 250);
  recordingIndicator.classList.add("active");
  timer.classList.add("active");
  recordBtn.disabled = true;
  stopBtn.disabled = false;
  cameraBtn.disabled = true;
  statusText.textContent =
    "Recording...";
}
function stopRecording() {
  if (!mediaRecorder) {
    return;
  }
  if (mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }
  clearInterval(timerInterval);
  recordingIndicator.classList.remove("active");
  timer.classList.remove("active");
  recordBtn.disabled = false;
  stopBtn.disabled = true;
  cameraBtn.disabled = false;
  statusText.textContent =
    "Processing recording...";
}
/* --------------------------------
   TIMER
-------------------------------- */
function updateTimer() {
  if (!recordingStartTime) {
    return;
  }
  const elapsed =
    Math.floor(
      (Date.now() - recordingStartTime) / 1000
    );
  const minutes =
    Math.floor(elapsed / 60);
  const seconds =
    elapsed % 60;
  timer.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}
/* --------------------------------
   CREATE RECORDING
-------------------------------- */
function createRecording(blob) {
  const url =
    URL.createObjectURL(blob);
  const recording = {
    id: Date.now(),
    blob: blob,
    url: url,
    created: new Date()
  };
  recordings.unshift(recording);
  renderRecordings();
  statusText.textContent =
    "Recording finished!";
}
/* --------------------------------
   RENDER RECORDINGS
-------------------------------- */
function renderRecordings() {
  recordingsList.innerHTML = "";
  if (recordings.length === 0) {
    recordingsList.appendChild(
      emptyMessage
    );
    return;
  }
  recordings.forEach(
    function(recording, index) {
      const item =
        document.createElement("div");
      item.className =
        "recording-item";
      const video =
        document.createElement("video");
      video.src =
        recording.url;
      video.controls = true;
      video.playsInline = true;
      const info =
        document.createElement("div");
      info.className =
        "recording-info";
      const left =
        document.createElement("div");
      left.innerHTML = `
        <div class="recording-name">
          Recording ${recordings.length - index}
        </div>
        <div class="recording-size">
          ${formatBytes(recording.blob.size)}
        </div>
      `;
      const right =
        document.createElement("div");
      right.innerHTML = `
        <div class="recording-size">
          ${recording.created.toLocaleTimeString()}
        </div>
      `;
      info.appendChild(left);
      info.appendChild(right);
      const download =
        document.createElement("button");
      download.className =
        "download-btn";
      download.textContent =
        "⬇️ Save Video";
      download.onclick =
        function() {
          downloadRecording(recording);
        };
      const deleteBtn =
        document.createElement("button");
      deleteBtn.className =
        "delete-btn";
      deleteBtn.textContent =
        "🗑 Delete";
      deleteBtn.onclick =
        function() {
          deleteRecording(recording.id);
        };
      const buttonRow =
        document.createElement("div");
      buttonRow.style.display =
        "grid";
      buttonRow.style.gridTemplateColumns =
        "1fr 1fr";
      buttonRow.style.gap =
        "8px";
      buttonRow.style.marginTop =
        "10px";
      buttonRow.appendChild(download);
      buttonRow.appendChild(deleteBtn);
      item.appendChild(video);
      item.appendChild(info);
      item.appendChild(buttonRow);
      recordingsList.appendChild(item);
    }
  );
}
/* --------------------------------
   DOWNLOAD
-------------------------------- */
function downloadRecording(recording) {
  const extension =
    recording.blob.type.includes("mp4")
      ? "mp4"
      : "webm";
  const filename =
    "recording-" +
    recording.id +
    "." +
    extension;
  const link =
    document.createElement("a");
  link.href =
    recording.url;
  link.download =
    filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
}
/* --------------------------------
   DELETE
-------------------------------- */
function deleteRecording(id) {
  const recording =
    recordings.find(
      r => r.id === id
    );
  if (recording) {
    URL.revokeObjectURL(
      recording.url
    );
  }
  recordings =
    recordings.filter(
      r => r.id !== id
    );
  renderRecordings();
}
/* --------------------------------
   FORMAT SIZE
-------------------------------- */
function formatBytes(bytes) {
  if (bytes === 0) {
    return "0 Bytes";
  }
  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];
  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );
  return (
    parseFloat(
      (bytes /
       Math.pow(1024, i))
      .toFixed(2)
    ) +
    " " +
    units[i]
  );
}
/* --------------------------------
   BUTTONS
-------------------------------- */
cameraBtn.addEventListener(
  "click",
  startCamera
);
recordBtn.addEventListener(
  "click",
  startRecording
);
stopBtn.addEventListener(
  "click",
  stopRecording
);
/* --------------------------------
   SAFETY CLEANUP
-------------------------------- */
window.addEventListener(
  "beforeunload",
  function() {
    if (stream) {
      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );
    }
    recordings.forEach(
      recording => {
        URL.revokeObjectURL(
          recording.url
        );
      }
    );
  }
);
</script>
</body>
</html>
